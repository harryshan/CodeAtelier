# 文件作用：在 GitHub 上自动验证常规代码与浏览器交互。
#
# 使用场景与输入输出：
# GitHub Actions 对 main 的 push 和 pull_request 执行常规验证，读取仓库锁定的包管理器配置。
#
# 代码结构与阅读顺序：
# 1. core 在 Linux、Windows 和 macOS 矩阵中安装 Node 24 及锁定依赖，再运行 pnpm check。
# 2. browser 在 Ubuntu 构建前端，安装 Chromium 及系统依赖，再运行 Playwright。
# 3. 矩阵关闭 fail-fast，以保留各平台检查结果。
#
# 维护注意事项：
# 不运行 Evaluation；某个平台的 CI 定义存在不等于当前提交已在该平台验证成功。

name: Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
