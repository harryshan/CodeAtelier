# GitHub Actions 的常规检查，暂时仅允许手动触发。
# 按仓库锁定的包管理器和依赖安装环境。
#
# 1. core 在 Linux、Windows 和 macOS 分别安装 Node 24/26，运行 pnpm check。
# 2. browser 在 Ubuntu 的 Node 24/26 下构建前端、安装 Chromium 和所需依赖，再运行 Playwright。
# 3. fail-fast 关闭，一台平台失败时仍保留其他平台的检查结果。
#
# 不运行 Evaluation；具体平台是否通过，以该次 CI 结果为准。

name: Checks
on:
  workflow_dispatch:
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  browser:
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
