<!doctype html>
<!--
CodeAtelier 网页入口，Vite 从这里加载 src/web/main.tsx。

1. head 设置中文页面的编码、移动设备视口和标题。
2. body 提供 root 容器，由 main.tsx 中的 React 应用接管。

修改容器 ID 时要同步 main.tsx；这里不放模型凭据。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>CodeAtelier</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
